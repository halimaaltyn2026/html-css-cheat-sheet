<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой To-Do List</title>
    <link rel="stylesheet" href="style.css"> <!-- Используем тот же или новый CSS -->
</head>
<body>
    <div class="todo-app">
        <h2>Мой список задач</h2>
        <input type="text" id="taskInput" placeholder="Что нужно сделать?">
        <button id="addBtn">Добавить</button>
        <button id="clearAllBtn" style="background-color: #e74c3c;">Очистить всё</button>
        <ul id="taskList"></ul>
        <br>
        <a href="index.html" style="color: #3498db; text-decoration: none;">← Назад на главную</a>
    </div>
    <script src="todo.js"></script>
</body>
</html>
