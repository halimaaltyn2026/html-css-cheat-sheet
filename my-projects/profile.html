<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль разработчика</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            padding: 32px;
            width: 350px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .avatar-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 24px;
            position: relative;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, #f43f5e, #a855f7, #3b82f6);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #fff;
            display: block;
        }

        .user-name {
            color: #1e293b;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .user-profession {
            color: #64748b;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .btn-add-friend {
            background-color: #1e3a1e;
            color: #4ade80;
            border: 2px solid #22c55e;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-add-friend:hover {
            background-color: #22c55e;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-container">
            
            <img src="https://github.com/halimaaltyn2026.png" alt="Халима Алтын">
        </div>
        <h2 class="user-name">Халима Алтын</h2>
        <p class="user-profession">Веб-разработчик</p>
        <button class="btn-add-friend">Добавить в друзья</button>
    </div>

</body>
</html>
